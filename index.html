<body>
<audio id="background-music" src="Musica.mp3" loop autoplay preload="auto"></audio>
<button id="music-toggle" class="music-toggle" type="button" aria-pressed="false" aria-label="Ativar m&uacute;sica de fundo" aria-controls="background-music"><span id="music-icon" aria-hidden="true">&#9835;</span><span id="music-label">M&uacute;sica</span></button>
<div id="music-status" class="music-status" role="status" aria-live="polite"></div>
<script>
(() => {
  const audio = document.getElementById('background-music');
  const button = document.getElementById('music-toggle');
  const label = document.getElementById('music-label');
  const icon = document.getElementById('music-icon');
  const status = document.getElementById('music-status');
  let timer;
  let autoWanted = true;
  let autoPending = false;
  audio.volume = 0.2;
  function update() {
    const playing = !audio.paused && !audio.error;
    button.setAttribute('aria-pressed', String(playing));
    button.setAttribute('aria-label', playing ? 'Pausar m\u00fasica de fundo' : 'Ativar m\u00fasica de fundo');
    label.textContent = playing ? 'Pausar m\u00fasica' : 'M\u00fasica';
    icon.textContent = playing ? '\u2161' : '\u266b';
  }
  function message(text) {
    clearTimeout(timer);
    status.textContent = text;
    timer = setTimeout(() => { status.textContent = ''; }, 6000);
  }
  function stopAutoStart() {
    autoWanted = false;
    audio.autoplay = false;
    document.removeEventListener('click', startOnInteraction);
    document.removeEventListener('keydown', startOnInteraction);
  }
  async function tryAutoStart() {
    if (!autoWanted || autoPending) return;
    autoPending = true;
    try {
      await audio.play();
    } catch (error) {
      // A blocked attempt is retried on the next user interaction.
    } finally {
      autoPending = false;
      update();
    }
  }
  function startOnInteraction(event) {
    if (button.contains(event.target)) return;
    if (event.type === 'keydown' && !['Enter', ' '].includes(event.key)) return;
    tryAutoStart();
  }
  audio.addEventListener('playing', () => { stopAutoStart(); update(); });
  audio.addEventListener('pause', update);
  audio.addEventListener('error', () => {
    update();
    message('N\u00e3o foi poss\u00edvel carregar a m\u00fasica. Tente novamente.');
  });
  button.addEventListener('click', async () => {
    stopAutoStart();
    clearTimeout(timer);
    status.textContent = '';
    if (!audio.paused) { audio.pause(); return; }
    button.disabled = true;
    button.setAttribute('aria-busy', 'true');
    label.textContent = 'Carregando\u2026';
    try {
      if (audio.error) audio.load();
      await audio.play();
    } catch (error) {
      message(error.name === 'NotAllowedError'
        ? 'Permita o \u00e1udio no navegador e tente novamente.'
        : 'N\u00e3o foi poss\u00edvel carregar a m\u00fasica. Tente novamente.');
    } finally {
      button.disabled = false;
      button.removeAttribute('aria-busy');
      update();
    }
  });
  document.addEventListener('click', startOnInteraction);
  document.addEventListener('keydown', startOnInteraction);
  tryAutoStart();
})();
</script>

const stage = document.getElementById('stage');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slides = [];

slides.push(`<div class="card"><div class="hero"><img class="pal animal-ilustrado" src="animal-cervinho.png" alt="Cervinho"><img class="snow" src="foto-isis.jpeg" fetchpriority="high" alt="Foto da Ísis"><img class="pal animal-ilustrado" src="animal-passarinho.png" alt="Passarinho azul"></div><span class="badge">Era uma vez…</span><h1>${esc(CONFIG.nome)}</h1><p>Vem ver como foram os primeiros 12 meses da nossa princesinha. Toque em Começar ✨</p></div>`);

slides.push(`<div class="card"><div class="mf"><img data-src="Nascimento.jpeg" alt="Foto do nascimento da \u00cdsis"></div><h2>Nascimento</h2><p>No dia 27/10/2025, \u00e0s 10h44 o amor ganhou forma, cheiro e um rostinho que j\u00e1 am\u00e1vamos antes mesmo de conhecer.<br>Com 3.200 kg e 50 cm de pura perfei\u00e7\u00e3o, \u00cdsis chegou atrav\u00e9s de uma cesariana, iluminando nossas vidas com sua presen\u00e7a</p></div>`);

CONFIG.meses.slice(0, 11).forEach((m, i) => {
  const ft = (CONFIG.fotos && CONFIG.fotos[i]) || '';
  const arquivoVideo = {0:'primeiro-mes.mp4',2:'3º Mês Video.mp4',7:'8º Mês.mp4',8:'9º Mês.mp4',10:'11º Mês.mp4'}[i];
  const topo = arquivoVideo
    ? `<div class="mf"><video muted data-src="${esc(arquivoVideo)}" aria-label="Vídeo da Ísis aos ${i+1} meses" loop playsinline preload="none"></video></div>`
    : ft
    ? `<div class="mf"><img data-src="${esc(ft)}" alt="${esc(CONFIG.nome)} com ${i+1} ${i===0?'mês':'meses'}" onerror="this.parentNode.classList.add('off')">${m[0] ? `<span class="tag">${m[0]}</span>` : ''}</div>`
    : `<span class="emoji">${m[0]}</span>`;
  slides.push(`<div class="card">${topo}<span class="badge">${i+1}º mês</span><h2>${esc(m[1])}</h2><p>${esc(m[2]).replace(/\n/g, '<br>')}</p></div>`);
});

slides.push(`<div class="card" id="convite-especial"><div class="mf"><img data-src="Convite especial.jpeg" alt="Ísis com vestido amarelo entre girassóis" style="object-position:center top!important"></div><p>E se você chegou até aqui, é porque de alguma forma fez parte da minha trajetória. Por isso, temos um convite muito especial para você… 💌</p></div>`);
slides.push(`<div class="card convite-final"><div class="duo"><img class="animal-convite" src="animal-cervinho.png" alt="Cervinho"><img class="photo" id="foto" data-src="foto-isis.jpeg" alt="Foto da ${esc(CONFIG.nome)}"><img class="animal-convite" src="animal-passarinho.png" alt="Passarinho azul"></div><span class="badge">1 aninho</span><h2>Você está convidado(a)!</h2><p>${esc(CONFIG.nome)} vai comemorar o primeiro ano e quer você por perto. Esperamos por você! 🍎</p><div class="info"><div>🎉 ${esc(CONFIG.tema)}</div><div>📅 ${esc(CONFIG.data)}</div><div>📍 ${esc(CONFIG.local)}</div></div><input id="guest" placeholder="Seu nome" autocomplete="name"><button class="cta" id="rsvp">✅ Confirmar presença</button></div>`);

slides.forEach(html => {
  const s = document.createElement('section');
  s.className = 'slide';
  s.innerHTML = html;
  stage.appendChild(s);
});

const els = [...document.querySelectorAll('.slide')];
const prev = document.getElementById('prev'), next = document.getElementById('next'), prog = document.getElementById('prog');
let cur = 0;

function go(n){
  n = Math.max(0, Math.min(els.length - 1, n));
  els.forEach((e, i) => {
    e.classList.toggle('active', i === n);
    e.classList.toggle('past', i < n);

  });
  cur = n;
  sincronizarMidia();
  atualizarGuirlanda();
  document.dispatchEvent(new Event('slidechange'));
  prev.disabled = n === 0;
  next.disabled = n === els.length - 1;
  next.textContent = n === 0 ? 'Começar →' : 'Continuar →';
  prog.style.width = (n / (els.length - 1) * 100) + '%';
  if (n === els.length - 1) confetti();
}
prev.onclick = () => go(cur - 1);
next.onclick = () => go(cur + 1);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === ' ') go(cur + 1);
  if (e.key === 'ArrowLeft') go(cur - 1);
});
let x0 = null;
document.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  if (x0 === null || e.target.tagName === 'INPUT') return;
  const d = e.changedTouches[0].clientX - x0;
  if (Math.abs(d) > 50) go(cur + (d < 0 ? 1 : -1));
  x0 = null;
});


/* bolhas de fundo */
const bb = document.getElementById('bubbles');
const itens = ['🍎','🌹','💖','🦋','🍃','🌸','🍎','🐦'];
for (let i = 0; i < 16; i++) {
  const s = document.createElement('span');
  s.textContent = itens[i % itens.length];
  s.style.cssText = `left:${Math.random()*100}%;font-size:${18+Math.random()*24}px;animation-duration:${12+Math.random()*14}s;animation-delay:${-Math.random()*20}s`;
  bb.appendChild(s);
}

/* confete */
const cv = document.getElementById('cf'), cx = cv.getContext('2d');
let parts = [], raf;
function confetti(){
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#c8202f','#f0b93a','#2f5fa8','#ffffff','#e98aa0','#6b9a58'];
  parts = Array.from({length: 90}, () => ({x: Math.random()*cv.width, y: -20 - Math.random()*cv.height*.5, r: 4+Math.random()*5, vy: 2+Math.random()*3, vx: -1+Math.random()*2, c: cols[Math.random()*cols.length|0], a: Math.random()*6}));
  cancelAnimationFrame(raf); tick();
}
function tick(){
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => { p.y += p.vy; p.x += p.vx + Math.sin(p.a += .05); cx.fillStyle = p.c; cx.fillRect(p.x, p.y, p.r, p.r*1.6); });
  parts = parts.filter(p => p.y < cv.height + 20);
  if (parts.length) raf = requestAnimationFrame(tick); else cx.clearRect(0, 0, cv.width, cv.height);
}

/* Only the current slide plays. The next slide prepares its original media. */


const midias = els.map(slide => ({
  imagens: [...slide.querySelectorAll('img[data-src]')],
  video: slide.querySelector('video')
}));



function prepararMidia(indice, atual = false) {
  const midia = midias[indice];
  if (!midia) return;
  midia.imagens.forEach(imagem => {
    if (!imagem.hasAttribute('src')) imagem.src = imagem.dataset.src;
  });
  if (midia.video) {
    midia.video.preload = atual ? 'auto' : 'metadata';
    if (!midia.video.hasAttribute('src')) midia.video.src = midia.video.dataset.src;
  }
}

function iniciarVideoAtual() {
  const video = midias[cur].video;
  if (!video || document.hidden || !video.paused) return;
  video.muted = true;
  video.play().catch(() => {});
}

function sincronizarMidia() {
  const videoAtual = midias[cur].video;
  midias.forEach(({video}) => {
    if (video && (video !== videoAtual || document.hidden)) {
      video.pause();
      video.preload = 'none';
    }
  });
  if (document.hidden) return;
  prepararMidia(cur, true);
  iniciarVideoAtual();
  prepararMidia(cur + 1);
}

midias.forEach(({video}) => {
  if (!video) return;
  video.addEventListener('play', () => {
    // A pending play must not restart a video after quick navigation away.
    if (document.hidden || video !== midias[cur].video) video.pause();
  });
});

document.addEventListener('visibilitychange', sincronizarMidia);
['click', 'keydown', 'touchend'].forEach(evento => document.addEventListener(evento, iniciarVideoAtual));


const garland = document.querySelector('.garland');
function atualizarGuirlanda() {
  garland.classList.toggle('is-hidden', els[cur].querySelector('.card').scrollTop > 8);
}
document.querySelectorAll('.card').forEach(card => {
  card.addEventListener('scroll', () => {
    card.classList.toggle('is-scrolled', card.scrollTop > 8);
    if (card.closest('.slide').classList.contains('active')) atualizarGuirlanda();
  }, {passive:true});
});

const guest = document.getElementById('guest');
const rsvp = document.getElementById('rsvp');
const label = document.createElement('span');
label.className = 'family-label';
label.textContent = 'Quantas pessoas da sua família vão?';
const options = document.createElement('div');
options.className = 'family-options';
options.setAttribute('role', 'group');
options.setAttribute('aria-label', 'Quantidade de pessoas da família');
for (let number = 1; number <= 10; number++) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = number;
  button.setAttribute('aria-label', `${number} pessoa${number === 1 ? '' : 's'}`);
  button.onclick = () => {
    options.querySelectorAll('button').forEach(option => option.classList.remove('selected'));
    button.classList.add('selected');
  };
  options.appendChild(button);
}
guest.insertAdjacentElement('afterend', label);
label.insertAdjacentElement('afterend', options);
rsvp.onclick = () => {
  const selected = options.querySelector('button.selected');
  const nome = guest.value.trim();
  const saudacao = nome ? `Ola! Aqui é ${nome}. ` : 'Ola! ';
  const confirmacao = `Confirmo minha presença no primeiro aninho da ${CONFIG.nome}.`;
  const quantidade = selected ? Number(selected.textContent) : 0;
  const pessoas = `${quantidade} pessoa${quantidade === 1 ? '' : 's'}`;
  const msg = selected ? `${saudacao}${confirmacao} Vou com ${pessoas} da minha família.` : `${saudacao}${confirmacao}`;
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
};
go(0);
</script>
