<style>

</style>
<audio id="background-music" src="Musica.mp3" loop autoplay preload="auto"></audio>
<button id="music-toggle" class="music-toggle" type="button" aria-pressed="false" aria-label="Ativar m&uacute;sica de fundo" aria-controls="background-music"><span id="music-icon" aria-hidden="true">&#9835;</span><span id="music-label">M&uacute;sica</span></button>
<div id="music-status" class="music-status" role="status" aria-live="polite"></div>
<script>
(() => {
  const audio = document.getElementById('background-music');
  const button = document.getElementById('music-toggle');
  const label = document.getElementById('music-label');
  const icon = document.getElementById('music-icon');
  const status = document.getElementById('music-status');
  let timer;
  let autoWanted = true;
  let autoPending = false;
  audio.volume = 0.2;
  function update() {
    const playing = !audio.paused && !audio.error;
    button.setAttribute('aria-pressed', String(playing));
    button.setAttribute('aria-label', playing ? 'Pausar m\u00fasica de fundo' : 'Ativar m\u00fasica de fundo');
    label.textContent = playing ? 'Pausar m\u00fasica' : 'M\u00fasica';
    icon.textContent = playing ? '\u2161' : '\u266b';
  }
  function message(text) {
    clearTimeout(timer);
    status.textContent = text;
    timer = setTimeout(() => { status.textContent = ''; }, 6000);
  }
  function stopAutoStart() {
    autoWanted = false;
    audio.autoplay = false;
    document.removeEventListener('click', startOnInteraction);
    document.removeEventListener('keydown', startOnInteraction);
  }
  async function tryAutoStart() {
    if (!autoWanted || autoPending || audio.dataset.videoPriority === 'true') return;
    autoPending = true;
    try {
      await audio.play();
    } catch (error) {
      // A blocked attempt is retried on the next user interaction.
    } finally {
      autoPending = false;
      update();
    }
  }
  function startOnInteraction(event) {
    if (button.contains(event.target)) return;
    if (event.type === 'keydown' && !['Enter', ' '].includes(event.key)) return;
    tryAutoStart();
  }
  audio.addEventListener('playing', () => { stopAutoStart(); update(); });
  audio.addEventListener('pause', update);
  audio.addEventListener('error', () => {
    update();
    message('N\u00e3o foi poss\u00edvel carregar a m\u00fasica. Tente novamente.');
  });
  button.addEventListener('click', async () => {
    stopAutoStart();
    clearTimeout(timer);
    status.textContent = '';
    if (!audio.paused) { audio.pause(); return; }
    button.disabled = true;
    button.setAttribute('aria-busy', 'true');
    label.textContent = 'Carregando\u2026';
    try {
      if (audio.error) audio.load();
      await audio.play();
    } catch (error) {
      message(error.name === 'NotAllowedError'
        ? 'Permita o \u00e1udio no navegador e tente novamente.'
        : 'N\u00e3o foi poss\u00edvel carregar a m\u00fasica. Tente novamente.');
    } finally {
      button.disabled = false;
      button.removeAttribute('aria-busy');
      update();
    }
  });
  document.addEventListener('click', startOnInteraction);
  document.addEventListener('keydown', startOnInteraction);
  tryAutoStart();
})();
</script>

const els = [...document.querySelectorAll('.slide')];
const prev = document.getElementById('prev'), next = document.getElementById('next'), prog = document.getElementById('prog');
let cur = 0;

function go(n){
  n = Math.max(0, Math.min(els.length - 1, n));
  els.forEach((e, i) => {
    e.classList.toggle('active', i === n);
    e.classList.toggle('past', i < n);

  });
  cur = n;
  document.dispatchEvent(new Event('slidechange'));
  prev.disabled = n === 0;
  next.disabled = n === els.length - 1;
  next.textContent = n === 0 ? 'Começar →' : 'Continuar →';
  prog.style.width = (n / (els.length - 1) * 100) + '%';
  if (n === els.length - 1) confetti();
}
prev.onclick = () => go(cur - 1);
next.onclick = () => go(cur + 1);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === ' ') go(cur + 1);
  if (e.key === 'ArrowLeft') go(cur - 1);
});
let x0 = null;
document.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  if (x0 === null || e.target.tagName === 'INPUT') return;
  const d = e.changedTouches[0].clientX - x0;
  if (Math.abs(d) > 50) go(cur + (d < 0 ? 1 : -1));
  x0 = null;
});

document.getElementById('rsvp').onclick = () => {
  const nome = document.getElementById('guest').value.trim();
  const msg = nome
    ? `Olá! Aqui é ${nome}. Confirmo minha presença no primeiro aninho da ${CONFIG.nome}! 🎉🎈`
    : `Olá! Confirmo minha presença no primeiro aninho da ${CONFIG.nome}! 🎉🎈`;
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
};

/* bolhas de fundo */
const bb = document.getElementById('bubbles');
const itens = ['🍎','🌹','💖','🦋','🍃','🌸','🍎','🐦'];
for (let i = 0; i < 16; i++) {
  const s = document.createElement('span');
  s.textContent = itens[i % itens.length];
  s.style.cssText = `left:${Math.random()*100}%;font-size:${18+Math.random()*24}px;animation-duration:${12+Math.random()*14}s;animation-delay:${-Math.random()*20}s`;
  bb.appendChild(s);
}

/* confete */
const cv = document.getElementById('cf'), cx = cv.getContext('2d');
let parts = [], raf;
function confetti(){
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#c8202f','#f0b93a','#2f5fa8','#ffffff','#e98aa0','#6b9a58'];
  parts = Array.from({length: 90}, () => ({x: Math.random()*cv.width, y: -20 - Math.random()*cv.height*.5, r: 4+Math.random()*5, vy: 2+Math.random()*3, vx: -1+Math.random()*2, c: cols[Math.random()*cols.length|0], a: Math.random()*6}));
  cancelAnimationFrame(raf); tick();
}
function tick(){
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => { p.y += p.vy; p.x += p.vx + Math.sin(p.a += .05); cx.fillStyle = p.c; cx.fillRect(p.x, p.y, p.r, p.r*1.6); });
  parts = parts.filter(p => p.y < cv.height + 20);
  if (parts.length) raf = requestAnimationFrame(tick); else cx.clearRect(0, 0, cv.width, cv.height);
}
go(0);
</script>

<script>
(() => {
  const guest = document.getElementById('guest');
  const rsvp = document.getElementById('rsvp');
  if (!guest || !rsvp) return;

  document.querySelectorAll('.info div').forEach(item => {
    if (item.textContent.includes('Presentes')) item.remove();
  });

  const oldInput = document.getElementById('familyCount');
  const label = document.createElement('span');
  label.className = 'family-label';
  label.textContent = 'Quantas pessoas da sua família vão?';

  const options = document.createElement('div');
  options.className = 'family-options';
  options.setAttribute('role', 'group');
  options.setAttribute('aria-label', 'Quantidade de pessoas da família');
  let quantidade = 1;

  for (let number = 1; number <= 10; number++) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = number;
    button.setAttribute('aria-label', `${number} pessoa${number === 1 ? '' : 's'}`);
    if (number === quantidade) button.classList.add('selected');
    button.onclick = () => {
      quantidade = number;
      options.querySelectorAll('button').forEach(option => option.classList.remove('selected'));
      button.classList.add('selected');
    };
    options.appendChild(button);
  }

  if (oldInput) oldInput.remove();
  guest.insertAdjacentElement('afterend', label);
  label.insertAdjacentElement('afterend', options);

  rsvp.onclick = () => {
    const nome = guest.value.trim();
    const pessoas = `${quantidade} pessoa${quantidade === 1 ? '' : 's'}`;
    const msg = nome
      ? `Olá! Aqui é ${nome}. Confirmo minha presença no primeiro aninho da ${CONFIG.nome}! Vou com ${pessoas} da minha família. 🎉🎈`
      : `Olá! Confirmo minha presença no primeiro aninho da ${CONFIG.nome}! Vou com ${pessoas} da minha família. 🎉🎈`;
    window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
  };
})();
</script>
<script>
window.addEventListener('load', () => {
  const rsvp = document.getElementById('rsvp');
  const guest = document.getElementById('guest');
  if (!rsvp || !guest) return;
  document.querySelectorAll('.family-options button').forEach(button => button.classList.remove('selected'));
  rsvp.onclick = () => {
    const selected = document.querySelector('.family-options button.selected');
    const nome = guest.value.trim();
    const saudacao = nome ? `Ola! Aqui ${String.fromCharCode(233)} ${nome}. ` : 'Ola! ';
    const confirmacao = `Confirmo minha presen${String.fromCharCode(231)}a no primeiro aninho da ${CONFIG.nome}.`;
    const quantidade = selected ? Number(selected.textContent) : 0;
    const pessoas = `${quantidade} pessoa${quantidade === 1 ? '' : 's'}`;
    const msg = selected ? `${saudacao}${confirmacao} Vou com ${pessoas} da minha fam${String.fromCharCode(237)}lia.` : `${saudacao}${confirmacao}`;
    window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
  };
});
</script>

<script id="audio-nono-mes">
(() => {
  const video = document.getElementById('video-nono-mes');
  const musica = document.getElementById('background-music');
  const botao = document.getElementById('music-toggle');
  let ativo = false;
  let retomarMusica = false;
  function iniciarVideo() {
    if (!ativo || !video.paused) return;
    video.muted = false;
    video.volume = 1;
    video.play().catch(() => {});
  }
  function sincronizar() {
    const visivel = video.closest('.slide').classList.contains('active');
    if (visivel === ativo) return;
    ativo = visivel;
    if (ativo) {
      retomarMusica = !musica.paused;
      musica.dataset.videoPriority = 'true';
      musica.pause();
      botao.disabled = true;
      video.currentTime = 0;
      iniciarVideo();
    } else {
      video.pause();
      delete musica.dataset.videoPriority;
      botao.disabled = false;
      if (retomarMusica) musica.play().catch(() => {});
      retomarMusica = false;
    }
  }
  musica.addEventListener('play', () => { if (ativo) musica.pause(); });
  document.addEventListener('slidechange', sincronizar);
  ['click', 'keydown', 'touchend'].forEach(evento => document.addEventListener(evento, iniciarVideo));
  sincronizar();
})();
</script>
